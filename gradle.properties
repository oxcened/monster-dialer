# Gradle daemon settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# The single authoritative app version. Android's integer versionCode is derived
# from this semantic version by app/build.gradle.kts.
appVersionName=0.4.0

# Exact OpenDialer revision used by CI and releases. Update this deliberately
# when taking compatible upstream changes so tagged releases remain reproducible.
opendialerRef=b7bb2e85e94ebec3e32265f2c709e3a3b8489fdc

# Use AndroidX dependencies throughout this project and its included modules.
android.useAndroidX=true
android.enableJetifier=true

# Keep resource IDs compatible with the included OpenDialer modules.
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# The project applies the Kotlin Android plugin explicitly. AGP 9's built-in
# Kotlin support would otherwise register the same extension twice.
android.builtInKotlin=false
android.newDsl=false
