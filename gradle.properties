# Gradle daemon settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# The authoritative app version values. versionCode must increase for every
# uploaded build, including builds uploaded to Play testing tracks.
appVersionName=0.7.0-alpha.3
appVersionCode=600003

# Use AndroidX dependencies throughout this project and its included modules.
android.useAndroidX=true
android.enableJetifier=true

# Keep resource IDs compatible with the included OpenDialer modules.
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# The project applies the Kotlin Android plugin explicitly. AGP 9's built-in
# Kotlin support would otherwise register the same extension twice.
android.builtInKotlin=false
android.newDsl=false
