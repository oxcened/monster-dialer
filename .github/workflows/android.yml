name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: monster-dialer

    steps:
      - name: Check out Monster Dialer
        uses: actions/checkout@v4
        with:
          path: monster-dialer

      - name: Read the pinned OpenDialer revision
        id: opendialer
        working-directory: monster-dialer
        run: |
          ref="$(sed -n 's/^opendialerRef=//p' gradle.properties)"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out OpenDialer
        uses: actions/checkout@v4
        with:
          repository: oxcened/opendialer
          ref: ${{ steps.opendialer.outputs.ref }}
          path: opendialer

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Restore licensed font
        env:
          FONT_ASSET_URL: ${{ secrets.FONT_ASSET_URL }}
          FONT_ASSET_TOKEN: ${{ secrets.FONT_ASSET_TOKEN }}
          FONT_ASSET_SHA256: ${{ secrets.FONT_ASSET_SHA256 }}
        run: |
          test -n "$FONT_ASSET_URL"
          test -n "$FONT_ASSET_TOKEN"
          test -n "$FONT_ASSET_SHA256"
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer $FONT_ASSET_TOKEN" \
            --header "Accept: application/octet-stream" \
            "$FONT_ASSET_URL" \
            --output app/src/main/res/font/ui_pixel_font.otf
          printf '%s  %s\n' "$FONT_ASSET_SHA256" "app/src/main/res/font/ui_pixel_font.otf" | sha256sum --check --status

      - name: Run unit tests, lint, and debug build
        run: ./gradlew test lint assembleDebug
