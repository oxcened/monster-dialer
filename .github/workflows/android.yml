name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: monster-dialer

    steps:
      - name: Check out Monster Dialer
        uses: actions/checkout@v3
        with:
          path: monster-dialer

      - name: Check out OpenDialer
        uses: actions/checkout@v3
        with:
          repository: oxcened/opendialer
          path: opendialer

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
