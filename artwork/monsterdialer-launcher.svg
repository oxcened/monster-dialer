<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 108 108" role="img" aria-labelledby="title desc">
  <title id="title">MonsterDialer launcher icon</title>
  <desc id="desc">A compact retro telecom console with a blank olive LCD and green and burgundy controls.</desc>

  <!-- A circular raster source prevents launchers from visibly clipping a square body. -->
  <circle cx="54" cy="54" r="54" fill="#ded8ca"/>

  <!-- A compact, original color-handheld-style display module, held within a circle-safe area. -->
  <rect x="19" y="22" width="70" height="30" rx="4" fill="#373832"/>
  <rect x="22" y="25" width="64" height="24" rx="2" fill="#20231e"/>
  <rect x="24.5" y="27.5" width="59" height="19" rx=".7" fill="#858c60"/>
  <path d="M26.5 29.3h55" fill="none" stroke="#aeb57d" stroke-width=".7" opacity=".42"/>

  <circle cx="35" cy="72" r="13" fill="#6f8b6b" stroke="#373832" stroke-width="1.7"/>
  <circle cx="73" cy="72" r="13" fill="#8d5358" stroke="#373832" stroke-width="1.7"/>
</svg>
